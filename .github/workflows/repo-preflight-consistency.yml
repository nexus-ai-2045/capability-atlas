name: repo-preflight-consistency

# `.repo-preflight-consistency.json` を upstream repo-preflight の consistency_gate へ接続する。
# 検査ロジックはコピーせず、nexus-ai-2045/repo-preflight を checkout して実行する。
# 開発保証パッケージを CI に埋め込まない。空の base ref は fail-closed。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Checkout upstream repo-preflight (no logic copy)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nexus-ai-2045/repo-preflight
          path: .tools/repo-preflight
          persist-credentials: false

      - name: Run consistency_gate against .repo-preflight-consistency.json
        env:
          CONSISTENCY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          BASE="${CONSISTENCY_BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "empty consistency base: fail-closed"
            exit 1
          fi
          test -f .repo-preflight-consistency.json
          test -f .tools/repo-preflight/scripts/consistency_gate.py
          python .tools/repo-preflight/scripts/consistency_gate.py \
            --repo . \
            --base-ref "$BASE" \
            --require-config \
            --require-mode shadow \
            --json | tee /tmp/consistency-report.json
          python - <<'PY'
          import json
          import sys

          report = json.load(open("/tmp/consistency-report.json", encoding="utf-8"))
          status = report.get("status")
          # shadow の所見は観測材料。tool_error / fail / 設定欠落は止める。
          if status in {"pass", "shadow_findings"}:
              print(f"consistency ok for CI policy: status={status!r} mode={report.get('mode')!r}")
              raise SystemExit(0)
          print(
              "fail-closed:",
              status,
              report.get("findings"),
              "(not a merge/public approval either way)",
          )
          raise SystemExit(1)
          PY
